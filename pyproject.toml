[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "outlier-flagger"
version = "0.1.0"
description = "Flag outliers with IQR, z-score and modified z-score (MAD) methods and write a report."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
outlier-flagger = "outlier_flagger.cli:main"

[tool.setuptools]
packages = ["outlier_flagger"]
